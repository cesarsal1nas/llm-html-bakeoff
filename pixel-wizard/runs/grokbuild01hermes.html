<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>grokbuild01hermes</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000000;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    image-rendering: pixelated;
  }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display: block;
  }
</style>
</head>
<body>
<canvas id="display"></canvas>
<script>
// grokbuildhermes - pixel art wizard spell animation
// 128x96 logical, integer pixel perfect, 60hz fixed timestep

const LOGICAL_W = 128;
const LOGICAL_H = 96;

const logical = document.createElement('canvas');
logical.width = LOGICAL_W;
logical.height = LOGICAL_H;
const lctx = logical.getContext('2d', { alpha: false });
lctx.imageSmoothingEnabled = false;

const display = document.getElementById('display');
const dctx = display.getContext('2d', { alpha: false });
dctx.imageSmoothingEnabled = false;

let scale = 1;
let offsetX = 0;
let offsetY = 0;

function resize() {
  scale = Math.max(1, Math.floor(Math.min(window.innerWidth / LOGICAL_W, window.innerHeight / LOGICAL_H)));
  display.width = LOGICAL_W * scale;
  display.height = LOGICAL_H * scale;
  offsetX = Math.floor((display.width - LOGICAL_W * scale) / 2);
  offsetY = Math.floor((display.height - LOGICAL_H * scale) / 2);
}
window.addEventListener('resize', resize);
resize();

// ==================== PALETTE (~24 colors) ====================
const C = {
  SKY1: '#0a0a2e',
  SKY2: '#12123a',
  SKY3: '#1a1a4a',
  MOON: '#f0e0c0',
  STAR_B: '#f0f0ff',
  STAR_D: '#707090',
  FLOOR_D: '#2a2a2a',
  FLOOR_M: '#3a3a3a',
  FLOOR_L: '#4a4a4a',
  HAT_D: '#2a1a3a',
  HAT: '#3a2a5a',
  ROBE_D: '#2a1a4a',
  ROBE_M: '#4a2a6a',
  ROBE_L: '#6a4a8a',
  BEARD_L: '#d0c0a0',
  BEARD_M: '#a08060',
  SKIN: '#f0d8b8',
  STAFF: '#5a5a5a',
  STAFF_D: '#3a3a3a',
  GEM_W: '#ffffff',
  GEM_B: '#ff88ff',
  GEM_M: '#cc44cc',
  GEM_D: '#662266',
  MAGIC1: '#ff66aa',
  MAGIC2: '#aa44ff',
  BLACK: '#000000'
};

// ==================== SCENE DATA ====================
let globalTick = 0;
let stars = [
  {x: 8, y: 6, phase: 0.0},
  {x: 22, y: 14, phase: 1.7},
  {x: 35, y: 4, phase: 0.9},
  {x: 51, y: 11, phase: 2.3},
  {x: 67, y: 7, phase: 1.1},
  {x: 81, y: 16, phase: 0.4},
  {x: 95, y: 3, phase: 3.1},
  {x: 108, y: 12, phase: 1.9},
  {x: 118, y: 8, phase: 2.6},
  {x: 14, y: 19, phase: 0.6},
  {x: 44, y: 18, phase: 1.4},
  {x: 73, y: 2, phase: 2.8}
];

// ==================== PARTICLE POOL (allocation free) ====================
const MAX_PART = 48;
let particles = [];
function initParticles() {
  particles = [];
  for (let i = 0; i < MAX_PART; i++) {
    particles.push({
      active: false,
      x: 0, y: 0,
      vx: 0, vy: 0,
      life: 0,
      cphase: 0,
      mode: 'burst',
      orbitPhase: 0,
      orbitR: 4
    });
  }
}
initParticles();

let projectile = { active: false, x: 0, y: 0, vx: 0, vy: 0 };

// ==================== STATE MACHINE ====================
let state = 'IDLE';
let stateFrame = 0;
let shake = { x: 0, y: 0 };

function getStateDuration(s) {
  if (s === 'IDLE') return 96;
  if (s === 'CHARGE') return 78;
  if (s === 'CAST') return 36;
  if (s === 'RECOVER') return 54;
  return 60;
}

// ==================== POSE ====================
let pose = {
  bob: 0,
  headTilt: 0,
  staffAngle: 14,
  armRaise: 0.15,
  robeSway: 0,
  gemPulse: 0.35
};

function getGemPos(p) {
  const bx = 48;
  const by = 34 + Math.floor(p.bob);
  const armBaseY = by + 26 + Math.floor(p.armRaise * 3);
  const handX = bx + 17 + Math.floor(p.armRaise * 1.2);
  const handY = armBaseY + 2;
  const rad = p.staffAngle * Math.PI / 180;
  const len = 21;
  return {
    x: Math.floor(handX + Math.sin(rad) * len),
    y: Math.floor(handY - Math.cos(rad) * len)
  };
}

function updatePose(progress) {
  const t = globalTick;
  const idleBob = Math.sin(t * 0.075) * 0.65;
  const idleSway = Math.sin(t * 0.055) * 0.55;

  if (state === 'IDLE') {
    pose.bob = idleBob;
    pose.robeSway = idleSway;
    pose.staffAngle = 14 + Math.sin(t * 0.042) * 2.5;
    pose.armRaise = 0.15 + Math.sin(t * 0.048) * 0.08;
    pose.headTilt = Math.sin(t * 0.032) * 0.35;
    pose.gemPulse = 0.32 + Math.sin(t * 0.095) * 0.09;
  } 
  else if (state === 'CHARGE') {
    const p = Math.min(1, Math.max(0, progress));
    pose.bob = idleBob * (1 - p * 0.6);
    pose.staffAngle = 14 + (-38 - 14) * p;
    pose.armRaise = 0.15 + 1.65 * p;
    pose.robeSway = idleSway * (1 - p * 0.7);
    pose.headTilt = 0.4 * p;
    pose.gemPulse = 0.45 + p * 0.55 + Math.sin(t * 0.28) * 0.22;
  } 
  else if (state === 'CAST') {
    const p = Math.min(1, Math.max(0, progress));
    pose.staffAngle = -38 + 48 * p;
    pose.armRaise = 1.8 - 0.9 * p;
    pose.gemPulse = 0.95 - p * 0.35;
    pose.bob = 0.8 * (1 - p);
    pose.headTilt = 0.6 - 0.5 * p;
    pose.robeSway = 0;
  } 
  else if (state === 'RECOVER') {
    const p = Math.min(1, Math.max(0, progress));
    pose.staffAngle = 10 + 4 * p;
    pose.armRaise = 0.9 - 0.75 * p;
    pose.gemPulse = 0.6 - 0.25 * p;
    pose.bob = 0.6 * (1 - p);
    pose.headTilt = 0.1 * (1 - p);
    pose.robeSway = idleSway * 0.4;
  }
}

// ==================== PARTICLES ====================
function updateParticles() {
  const gem = getGemPos(pose);

  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    if (!p.active) continue;

    if (p.mode === 'orbit' && state === 'CHARGE') {
      p.orbitPhase += 0.145;
      p.orbitR = Math.max(1.8, p.orbitR - 0.018);
      p.x = gem.x + Math.cos(p.orbitPhase) * p.orbitR;
      p.y = gem.y + Math.sin(p.orbitPhase) * p.orbitR * 0.82;
      p.cphase = ((globalTick + i) % 7 < 3) ? 0 : 1;

      if (p.orbitR < 2.1) {
        // respawn orbit
        p.orbitR = 5.5 + Math.random() * 2.2;
        p.orbitPhase = Math.random() * Math.PI * 2;
        p.cphase = 0;
      }
    } else {
      // burst / normal
      p.x += p.vx;
      p.y += p.vy;
      p.life--;
      p.vy += 0.035; // very light gravity
      if (p.life <= 0) {
        p.active = false;
        continue;
      }
      if (globalTick % 3 === 0) {
        p.cphase = Math.min(3, p.cphase + 1);
      }
    }
  }
}

function spawnOrbitParticles() {
  let spawned = 0;
  const gem = getGemPos(pose);
  for (let i = 0; i < particles.length && spawned < 14; i++) {
    const p = particles[i];
    if (!p.active) {
      p.active = true;
      p.mode = 'orbit';
      p.orbitR = 5.2 + Math.random() * 2.4;
      p.orbitPhase = Math.random() * Math.PI * 2;
      p.x = gem.x + Math.cos(p.orbitPhase) * p.orbitR;
      p.y = gem.y + Math.sin(p.orbitPhase) * p.orbitR * 0.82;
      p.life = 9999;
      p.cphase = 0;
      spawned++;
    }
  }
}

function spawnBurst() {
  const gem = getGemPos(pose);
  let spawned = 0;
  for (let i = 0; i < particles.length && spawned < 22; i++) {
    const p = particles[i];
    if (!p.active) {
      p.active = true;
      p.mode = 'burst';
      p.x = gem.x;
      p.y = gem.y;
      const ang = Math.random() * Math.PI * 2;
      const spd = 1.4 + Math.random() * 1.9;
      p.vx = Math.cos(ang) * spd;
      p.vy = Math.sin(ang) * spd * 0.65 - 0.4;
      p.life = 18 + Math.random() * 14;
      p.cphase = 0;
      spawned++;
    }
  }
}

// ==================== UPDATE ====================
function update() {
  globalTick++;
  stateFrame++;

  const dur = getStateDuration(state);
  const progress = stateFrame / dur;

  updatePose(progress);
  updateParticles();

  // projectile
  if (projectile.active) {
    projectile.x += projectile.vx;
    projectile.y += projectile.vy;
    projectile.vy += 0.012;
    if (projectile.x > 122 || projectile.y > 82) {
      projectile.active = false;
    }
  }

  // shake decay
  shake.x *= 0.72;
  shake.y *= 0.72;
  if (Math.abs(shake.x) < 0.6) shake.x = 0;
  if (Math.abs(shake.y) < 0.6) shake.y = 0;

  // state transitions
  if (stateFrame >= dur) {
    stateFrame = 0;
    const prev = state;

    if (state === 'IDLE') {
      state = 'CHARGE';
      spawnOrbitParticles();
    } 
    else if (state === 'CHARGE') {
      state = 'CAST';
      spawnBurst();
      // fire projectile
      const gem = getGemPos(pose);
      projectile.active = true;
      projectile.x = gem.x + 1;
      projectile.y = gem.y;
      projectile.vx = 3.8;
      projectile.vy = -0.35;
      // shake
      shake.x = (Math.random() > 0.5 ? 1 : -1) * 1.8;
      shake.y = (Math.random() > 0.6 ? 1 : 0) * 1;
    } 
    else if (state === 'CAST') {
      state = 'RECOVER';
    } 
    else if (state === 'RECOVER') {
      state = 'IDLE';
    }
  }
}

// ==================== DRAW BACKGROUND ====================
function drawBackground(ctx) {
  // already sky filled in render

  // stars
  for (let i = 0; i < stars.length; i++) {
    const s = stars[i];
    const b = Math.sin(globalTick * 0.09 + s.phase) > 0 ? C.STAR_B : C.STAR_D;
    ctx.fillStyle = b;
    ctx.fillRect(s.x, s.y, 1, 1);
    // occasional twinkle 2px
    if ((globalTick + i * 3) % 11 === 0) {
      ctx.fillRect(s.x - 1, s.y, 1, 1);
    }
  }

  // moon (simple pixel crescent-ish)
  ctx.fillStyle = C.MOON;
  ctx.fillRect(101, 7, 7, 1);
  ctx.fillRect(99, 8, 10, 1);
  ctx.fillRect(98, 9, 12, 2);
  ctx.fillRect(99, 11, 10, 2);
  ctx.fillRect(100, 13, 8, 1);
  ctx.fillRect(101, 14, 6, 1);
  ctx.fillRect(102, 15, 4, 1);

  // stone floor
  ctx.fillStyle = C.FLOOR_D;
  ctx.fillRect(0, 67, 128, 29);
  ctx.fillStyle = C.FLOOR_M;
  for (let x = 1; x < 128; x += 3) {
    ctx.fillRect(x, 68, 1, 28);
  }
  ctx.fillStyle = C.FLOOR_L;
  ctx.fillRect(12, 67, 6, 1);
  ctx.fillRect(29, 67, 4, 1);
  ctx.fillRect(47, 67, 7, 1);
  ctx.fillRect(68, 67, 3, 1);
  ctx.fillRect(83, 67, 5, 1);
  ctx.fillRect(101, 67, 6, 1);
  ctx.fillRect(19, 71, 2, 1);
  ctx.fillRect(55, 74, 2, 1);
  ctx.fillRect(91, 69, 2, 1);
}

// ==================== DRAW WIZARD (procedural pixel art) ====================
function drawWizard(ctx, p) {
  const bx = 48;
  const by = 34 + Math.floor(p.bob);
  const hatShift = Math.floor(p.headTilt * 1.6);

  // === HAT (pointed with bend) ===
  ctx.fillStyle = C.HAT_D;
  ctx.fillRect(bx + 2, by + 11, 18, 3);           // brim dark
  ctx.fillStyle = C.HAT;
  ctx.fillRect(bx + 3, by + 10, 16, 2);
  // cone layers
  ctx.fillRect(bx + 4, by + 7, 14, 3);
  ctx.fillRect(bx + 5 + hatShift, by + 3, 12, 4);
  ctx.fillRect(bx + 7 + hatShift, by, 8, 3);
  ctx.fillRect(bx + 9 + hatShift, by - 2, 5, 2);
  ctx.fillRect(bx + 10 + hatShift, by - 3, 3, 1); // tip

  // hat highlight line
  ctx.fillStyle = C.ROBE_L;
  ctx.fillRect(bx + 5, by + 8, 2, 1);

  // === HEAD ===
  ctx.fillStyle = C.SKIN;
  ctx.fillRect(bx + 7, by + 12, 9, 6);
  // ear hint
  ctx.fillRect(bx + 6, by + 14, 1, 2);
  ctx.fillRect(bx + 15, by + 14, 1, 2);

  // eyes
  ctx.fillStyle = C.BLACK;
  ctx.fillRect(bx + 9, by + 14, 1, 1);
  ctx.fillRect(bx + 13, by + 14, 1, 1);

  // === BEARD ===
  ctx.fillStyle = C.BEARD_L;
  ctx.fillRect(bx + 6, by + 17, 11, 16);
  ctx.fillRect(bx + 5, by + 20, 2, 8);
  ctx.fillRect(bx + 16, by + 23, 2, 7);
  ctx.fillStyle = C.BEARD_M;
  ctx.fillRect(bx + 7, by + 19, 9, 12);
  ctx.fillRect(bx + 6, by + 22, 2, 5);
  ctx.fillRect(bx + 15, by + 25, 2, 4);

  // === ROBE (two-shade + outline) ===
  ctx.fillStyle = C.ROBE_D;
  ctx.fillRect(bx + 3, by + 24, 17, 25);           // dark base/outline

  ctx.fillStyle = C.ROBE_M;
  ctx.fillRect(bx + 4, by + 25, 15, 23);

  // robe folds / shading
  ctx.fillStyle = C.ROBE_L;
  ctx.fillRect(bx + 5, by + 26, 2, 9);
  ctx.fillRect(bx + 13, by + 26, 2, 9);
  ctx.fillRect(bx + 8, by + 30, 1, 5);

  // bottom sway
  const sway = Math.floor(p.robeSway * 1.8);
  ctx.fillStyle = C.ROBE_M;
  ctx.fillRect(bx + 4 + sway, by + 46, 15, 2);
  ctx.fillStyle = C.ROBE_D;
  ctx.fillRect(bx + 3 + sway, by + 47, 17, 2);

  // === LEFT ARM (hanging) ===
  ctx.fillStyle = C.ROBE_M;
  ctx.fillRect(bx + 3, by + 26, 3, 8);
  ctx.fillRect(bx + 2, by + 33, 3, 6);

  // === RIGHT ARM (holding staff) ===
  const armX = bx + 15 + Math.floor(p.armRaise * 1.4);
  const armY = by + 25 + Math.floor(p.armRaise * 3.2);
  ctx.fillStyle = C.ROBE_M;
  ctx.fillRect(bx + 15, by + 25, 4, 6);            // upper
  ctx.fillRect(armX, armY, 3, 5);                  // forearm

  // hand
  ctx.fillStyle = C.SKIN;
  ctx.fillRect(armX + 1, armY + 3, 2, 2);

  // === STAFF ===
  const staffBaseX = armX + 1;
  const staffBaseY = armY + 4;
  const rad = p.staffAngle * Math.PI / 180;
  const len = 21;

  ctx.fillStyle = C.STAFF_D;
  for (let i = 0; i < len; i++) {
    const sx = Math.floor(staffBaseX + Math.sin(rad) * i);
    const sy = Math.floor(staffBaseY - Math.cos(rad) * i);
    ctx.fillRect(sx - 1, sy, 3, 1);
  }
  ctx.fillStyle = C.STAFF;
  for (let i = 2; i < len - 1; i++) {
    const sx = Math.floor(staffBaseX + Math.sin(rad) * i);
    const sy = Math.floor(staffBaseY - Math.cos(rad) * i);
    ctx.fillRect(sx, sy, 1, 1);
  }

  // staff wrap/band
  const bandX = Math.floor(staffBaseX + Math.sin(rad) * 7);
  const bandY = Math.floor(staffBaseY - Math.cos(rad) * 7);
  ctx.fillStyle = C.ROBE_D;
  ctx.fillRect(bandX - 1, bandY, 3, 1);

  // === GEM ===
  const gem = getGemPos(p);
  const gcol = (p.gemPulse > 0.65) ? C.GEM_B : C.GEM_M;
  ctx.fillStyle = gcol;
  ctx.fillRect(gem.x - 1, gem.y - 1, 3, 3);
  ctx.fillStyle = C.GEM_W;
  ctx.fillRect(gem.x, gem.y, 1, 1);

  // extra bright core during charge/cast
  if (p.gemPulse > 0.75) {
    ctx.fillStyle = C.GEM_W;
    ctx.fillRect(gem.x - 1, gem.y, 1, 1);
    ctx.fillRect(gem.x + 1, gem.y, 1, 1);
  }

  // === 1px RIM LIGHT from gem (right side of wizard) ===
  if (p.gemPulse > 0.55) {
    ctx.fillStyle = C.ROBE_L;
    // robe right edge
    ctx.fillRect(bx + 18, by + 27, 1, 11);
    ctx.fillRect(bx + 18, by + 40, 1, 5);
    // hat brim right
    ctx.fillRect(bx + 19, by + 10, 1, 2);
    // beard right
    ctx.fillRect(bx + 16, by + 20, 1, 4);
    // head right
    ctx.fillRect(bx + 15, by + 14, 1, 2);
  }
}

// ==================== DRAW PARTICLES & PROJECTILE ====================
function drawParticles(ctx) {
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    if (!p.active) continue;
    const px = Math.floor(p.x);
    const py = Math.floor(p.y);
    let col = C.GEM_D;
    if (p.cphase === 0) col = C.GEM_W;
    else if (p.cphase === 1) col = C.GEM_B;
    else if (p.cphase === 2) col = C.GEM_M;
    ctx.fillStyle = col;
    ctx.fillRect(px, py, 1, 1);
    // occasional 2px spark on bright phase
    if (p.cphase < 2 && (globalTick + i) % 5 === 0) {
      ctx.fillRect(px + 1, py, 1, 1);
    }
  }
}

function drawProjectile(ctx) {
  if (!projectile.active) return;
  const px = Math.floor(projectile.x);
  const py = Math.floor(projectile.y);
  ctx.fillStyle = C.GEM_B;
  ctx.fillRect(px, py, 2, 2);
  ctx.fillStyle = C.GEM_M;
  ctx.fillRect(px - 2, py + 1, 2, 1);
  ctx.fillRect(px - 4, py + 2, 1, 1);
}

// ==================== MAIN RENDER ====================
function render() {
  // draw to logical canvas
  lctx.fillStyle = C.SKY1;
  lctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);

  // subtle sky gradient via rects
  lctx.fillStyle = C.SKY2;
  lctx.fillRect(0, 0, LOGICAL_W, 38);
  lctx.fillStyle = C.SKY3;
  lctx.fillRect(0, 0, LOGICAL_W, 18);

  drawBackground(lctx);
  drawWizard(lctx, pose);
  drawParticles(lctx);
  drawProjectile(lctx);

  // blit to display (integer scale, centered, no smoothing)
  dctx.clearRect(0, 0, display.width, display.height);
  const sx = offsetX + Math.floor(shake.x * scale);
  const sy = offsetY + Math.floor(shake.y * scale);
  dctx.drawImage(
    logical,
    0, 0, LOGICAL_W, LOGICAL_H,
    sx, sy, LOGICAL_W * scale, LOGICAL_H * scale
  );
}

// ==================== FIXED 60HZ LOOP ====================
let lastTime = performance.now();
let accumulator = 0;
const TIMESTEP = 1000 / 60;

function gameLoop(now = performance.now()) {
  accumulator += now - lastTime;
  lastTime = now;

  while (accumulator >= TIMESTEP) {
    update();
    accumulator -= TIMESTEP;
  }

  render();
  requestAnimationFrame(gameLoop);
}

// kick off
gameLoop();

// Optional: keyboard hint (press any key to force next phase)
window.addEventListener('keydown', () => {
  stateFrame = getStateDuration(state) - 1;
});
</script>
</body>
</html>
