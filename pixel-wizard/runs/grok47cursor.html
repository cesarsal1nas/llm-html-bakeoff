var COL = new Uint32Array(24);

var staffAng = 0.82;
var armF = 0;

var beardF = 0;

var pStaff = 0.82;

var anchorY = AY0;

var handY = 0;

var gemY = 56;

var shakeY = 0;

var boltX = 0;
var boltY = 0;
var rngS = 0xA3C59AC3;

var oy = 0;
var otilt = 0;

var packWord = new Uint32Array(1);
var packByte = new Uint8Array(packWord.buffer);

function packCol(hex) {
  packByte[0] = (hex >> 16) & 255;
  packByte[1] = (hex >> 8) & 255;
  packByte[2] = hex & 255;
  packByte[3] = 255;
  return packWord[0];
}

function initPalette() {
  var i;
  for (i = 0; i < 24; i++) COL[i] = packCol(HEX[i]);
  for (i = 0; i < 24; i++) {
    RIM[i] = i;
    RIM[24 + i] = i;
    RIM[48 + i] = i;
  }
  RIM[10] = 11;
  RIM[11] = 12;
  RIM[12] = 13;
  RIM[15] = 14;
  RIM[17] = 16;
  RIM[19] = 18;
  RIM[24 + 10] = 23;
  RIM[24 + 11] = 22;
  RIM[24 + 12] = 21;
  RIM[24 + 13] = 21;
  RIM[24 + 15] = 21;
  RIM[24 + 14] = 21;
  RIM[24 + 17] = 21;
  RIM[24 + 16] = 20;
  RIM[24 + 19] = 22;
  RIM[24 + 18] = 21;
  RIM[48 + 10] = 22;
  RIM[48 + 11] = 21;
  RIM[48 + 12] = 20;
  RIM[48 + 13] = 20;
  RIM[48 + 15] = 20;
  RIM[48 + 14] = 20;
  RIM[48 + 17] = 20;
  RIM[48 + 16] = 20;
  RIM[48 + 19] = 21;
  RIM[48 + 18] = 20;
}

function qi(v) {
  if (v >= 0) return (v + 0.5) | 0;
  return (v - 0.5) | 0;
}

function lerp(a, b, t) {
  return a + (b - a) * t;
}

function easeInOut(t) {
  var u;
  if (t < 0.5) return 2 * t * t;
  u = 1 - t;
  return 1 - 2 * u * u;
}

function easeOut(t) {
  var u = 1 - t;
  return 1 - u * u;
}

function plot(x, y, c, body) {
  var i;
  x |= 0;
  y |= 0;
  if (x < 0 || y < 0 || x >= LW || y >= LH) return;
  i = y * LW + x;
  buf32[i] = COL[c];
  if (body) occ[i] = (stamp << 8) | (c + 1);
}

function fillRect(x, y, w, h, c) {
  var yy, xx, row, x1, y1, v;
  v = COL[c];
  x |= 0;
  y |= 0;
  x1 = x + w;
  y1 = y + h;
  if (x < 0) x = 0;
  if (y < 0) y = 0;
  if (x1 > LW) x1 = LW;
  if (y1 > LH) y1 = LH;
  for (yy = y; yy < y1; yy++) {
    row = yy * LW;
    for (xx = x; xx < x1; xx++) buf32[row + xx] = v;
  }
}

function line(x0, y0, x1, y1, c) {
  var dx, dy, sx, sy, err, e2, n;
  x0 |= 0;
  y0 |= 0;
  x1 |= 0;
  y1 |= 0;
  dx = x1 - x0;
  dy = y1 - y0;
  sx = dx < 0 ? -1 : 1;
  sy = dy < 0 ? -1 : 1;
  if (dx < 0) dx = -dx;
  if (dy < 0) dy = -dy;
  err = dx - dy;
  n = 0;
  for (;;) {
    plot(x0, y0, c, 1);
    if (x0 === x1 && y0 === y1) break;
    e2 = err << 1;
    if (e2 > -dy) {
      err -= dy;
      x0 += sx;
    }
    if (e2 < dx) {
      err += dx;
      y0 += sy;
    }
    n++;
    if (n > 48) break;
  }
}

function rnd() {
  rngS = (Math.imul(rngS, 1664525) + 1013904223) >>> 0;
  return rngS;
}

function hp(x, y, c) {
  var extra = 0;
  if (y < 5) extra = olean;
  plot(ox + x + otilt + extra, oy + y, c, 1);
}

function fp(x, y, c) {
  plot(ox + x + otilt, oy + y, c, 1);
}

function drawSky() {
  fillRect(0, 0, LW, 36, 0);
  fillRect(0, 36, LW, 22, 1);
  fillRect(0, 58, LW, 16, 2);
  fillRect(0, 74, LW, 6, 3);
  fillRect(0, 80, LW, 16, 9);
}

function drawMoon() {
  var cx = 106;
  var cy = 16;
  var r = 7;
  var x, y, d, c;
  for (y = -r; y <= r; y++) {
    for (x = -r; x <= r; x++) {
      d = x * x + y * y;
      if (d <= 49) {
        c = 4;
        if (x > 2) c = 5;
        plot(cx + x, cy + y, c, 0);
      }
    }
  }
  plot(cx - 3, cy - 3, 6, 0);
  plot(cx - 2, cy - 1, 5, 0);
  plot(cx + 1, cy + 2, 5, 0);
  plot(cx - 3, cy + 2, 5, 0);
  plot(cx + 2, cy - 2, 5, 0);
}

function drawStars() {
  var i, t, c, n;
  n = STAR_X.length;
  for (i = 0; i < n; i++) {
    t = (frameN + STAR_P[i]) % 48;
    c = 7;
    if (t < 5 || (t > 26 && t < 31)) c = 6;
    plot(STAR_X[i], STAR_Y[i], c, 0);
  }
}

function drawFloor() {
  var x, i;
  for (x = 0; x < LW; x++) {
    plot(x, 80, 8, 0);
    if ((x % 18) === 0) {
      plot(x, 81, 8, 0);
      plot(x, 82, 8, 0);
      plot(x, 83, 8, 0);
    } else if ((x % 18) === 9) {
      plot(x, 88, 8, 0);
      plot(x, 89, 8, 0);
      plot(x, 90, 8, 0);
    }
  }
  for (i = 0; i < PEB_X.length; i++) plot(PEB_X[i], PEB_Y[i], 8, 0);
}

function drawShadow(sway) {
  var cx = anchorX + 11 + sway;
  var x;
  for (x = cx - 6; x <= cx + 6; x++) plot(x, 81, 8, 0);
}

function drawRobe(swayAmp) {
  var i, y, sway, half, cx, left, right, x, c;
  for (i = 0; i < 14; i++) {
    y = 18 + i;
    sway = qi((swayAmp * i) / 10);
    half = 7;
    if (i > 6) {
      half = 7 + ((i - 6) >> 1);
      if (half > 9) half = 9;
    }
    cx = 11 + sway;
    left = cx - half;
    right = cx + half;
    for (x = left; x <= right; x++) {
      if (x === left || x === right || i === 13) c = 10;
      else if (i === 6) c = (x === cx) ? 6 : 10;
      else if (i === 12) c = (x < cx) ? 12 : 13;
      else if (x === cx) c = 11;
      else if (x < cx - 2) c = 11;
      else if (x >= cx + 3) c = 13;
      else c = 12;
      plot(anchorX + x, anchorY + y, c, 1);
    }
  }
}

function drawBeard(tilt, amp) {
  var i, y, sway, half, cx, left, right, x, c;
  for (i = 0; i < 14; i++) {
    y = 17 + i;
    sway = qi((tilt * (13 - i) + amp * i * 1.15) / 13);
    half = 4 - ((i * 4) / 13 | 0);
    if (half < 0) half = 0;
    cx = 11 + sway;
    left = cx - half;
    right = cx + half;
    for (x = left; x <= right; x++) {
      if (half >= 1 && (x === left || x === right)) c = 10;
      else if (half === 0) c = 15;
      else if (x < cx) c = 15;
      else c = 14;
      plot(anchorX + x, anchorY + y, c, 1);
    }
  }
}

function drawFace(eye) {
  var x;
  fp(7, 14, 10);
  fp(15, 14, 10);
  for (x = 8; x <= 14; x++) fp(x, 14, 17);
  fp(7, 15, 10);
  fp(15, 15, 10);
  fp(8, 15, 17);
  fp(9, 15, eye);
  fp(10, 15, 16);
  fp(11, 15, 17);
  fp(12, 15, 16);
  fp(13, 15, eye);
  fp(14, 15, 16);
  fp(7, 16, 10);
  fp(15, 16, 10);
  fp(8, 16, 15);
  fp(9, 16, 16);
  fp(10, 16, 16);
  fp(11, 16, 17);
  fp(12, 16, 16);
  fp(13, 16, 16);
  fp(14, 16, 14);
}

function drawHatPixels(clasp) {
  var x;
  hp(14, 0, 13);
  hp(15, 0, 10);
  hp(13, 1, 10);
  hp(14, 1, 13);
  hp(15, 1, 10);
  hp(12, 2, 10);
  hp(13, 2, 12);
  hp(14, 2, 13);
  hp(15, 2, 10);

  hp(10, 4, 10);

  hp(14, 4, 10);
  hp(9, 5, 10);
  hp(10, 5, 11);
  hp(11, 5, 11);
  hp(12, 5, 12);
  hp(13, 5, 13);
  hp(14, 5, 10);
  hp(8, 6, 10);
  hp(9, 6, 11);
  hp(10, 6, 11);
  hp(11, 6, 12);
  hp(12, 6, 12);
  hp(13, 6, 13);
  hp(14, 6, 10);
  hp(7, 7, 10);
  hp(8, 7, 11);
  hp(9, 7, 11);
  hp(10, 7, 12);
  hp(11, 7, 12);
  hp(12, 7, 13);

  hp(14, 9, 12);
  hp(15, 9, 11);
  hp(16, 9, 10);
  hp(4, 10, 10);
  for (x = 5; x <= 16; x++) hp(x, 10, x >= 13 ? 12 : 11);
  hp(17, 10, 10);
  hp(11, 10, clasp);
  hp(2, 11, 10);
  for (x = 3; x <= 19; x++) hp(x, 11, x >= 15 ? 13 : 12);
  hp(20, 11, 10);
  hp(3, 12, 10);
  for (x = 4; x <= 18; x++) hp(x, 12, 13);
  hp(19, 12, 10);
  hp(5, 13, 10);
  for (x = 6; x <= 17; x++) hp(x, 13, 11);
  hp(18, 13, 10);
}

function drawWizard() {
  var tilt = qi(headF);
  var lift = qi(armF);
  var topSway = qi((robeF * 3) / 10);
  var clasp = 22;
  var eye = 6;
  var sx, sy;
  if (state === ST_CAST) {
    clasp = 20;
    eye = 20;
  } else if (state === ST_CHARGE && stTimer > 28) {
    clasp = 21;
    eye = 21;
  } else if (state === ST_RECOVER && stTimer < 22) {
    clasp = 21;
    eye = 21;
  }
  drawShadow(qi((robeF * 13) / 10));
  drawRobe(robeF);
  drawBeard(tilt, beardF);
  ox = anchorX;
  oy = anchorY;
  otilt = tilt;
  olean = tilt < 0 ? -1 : tilt > 0 ? 1 : 0;
  drawFace(eye);
  drawHatPixels(clasp);
  sx = anchorX + 18 + topSway;
  sy = anchorY + 21;
  handX = sx + 5;
  handY = sy - lift;
  line(sx, sy, handX, handY, 12);
  line(sx, sy + 1, handX, handY + 1, 11);
  line(handX, handY, gemX, gemY, 18);
  line(handX, handY + 1, gemX, gemY + 1, 19);
  plot(handX, handY, 16, 1);
  plot(handX + 1, handY, 16, 1);
  plot(handX, handY + 1, 17, 1);
  plot(handX - 1, handY, 17, 1);
}

function rimLevel() {
  if (state === ST_CHARGE) return stTimer > 52 ? 2 : 1;
  if (state === ST_CAST) return 2;
  if (state === ST_RECOVER) return stTimer < 30 ? 1 : 0;
  return 0;
}

function rimPass() {
  var lv = rimLevel();
  var base = lv * 24;
  var gx = gemX;
  var gy = gemY;
  var y, x, cell, c, dx, dy, sx, sy, nx, ny, nc;
  for (y = 44; y <= 84; y++) {
    for (x = 18; x <= 100; x++) {
      cell = occ[y * LW + x];
      if ((cell >>> 8) !== stamp) continue;
      dx = gx - x;
      dy = gy - y;
      if (dx * dx + dy * dy > 1156) continue;
      sx = dx > 0 ? 1 : dx < 0 ? -1 : 0;
      sy = dy > 0 ? 1 : dy < 0 ? -1 : 0;
      if (sx === 0 && sy === 0) continue;
      nx = x + sx;
      ny = y + sy;
      if (nx < 0 || ny < 0 || nx >= LW || ny >= LH || (occ[ny * LW + nx] >>> 8) !== stamp) {
        c = (cell & 255) - 1;
        nc = RIM[base + c];
        buf32[y * LW + x] = COL[nc];
      }
    }
  }
}

function drawGroundGlow() {
  var x, c;
  if (state === ST_IDLE) return;
  if (state === ST_RECOVER && stTimer > 36) return;
  x = gemX | 0;
  c = state === ST_CAST ? 22 : 23;
  plot(x, 82, c, 0);
  plot(x - 1, 83, c, 0);
  plot(x + 1, 83, c, 0);
  if (state === ST_CAST && stTimer < 18) {
    plot(x, 83, 21, 0);
    plot(x - 2, 84, 23, 0);
    plot(x + 2, 84, 23, 0);
  }
}

function pstep(i) {
  var max = pmax[i];
  var q;
  if (max <= 0) return 3;
  q = (((max - plife[i]) * 4) / max) | 0;
  if (q < 0) q = 0;
  if (q > 3) q = 3;
  return q;
}

function allocSlot() {
  var i;
  for (i = 0; i < MAXP; i++) {
    if (pmode[i] === 0) return i;
  }
  return -1;
}

function spawnFree(x, y, vx0, vy0, life) {
  var i = allocSlot();
  if (i < 0) return;
  pmode[i] = 2;
  px[i] = x;
  py[i] = y;
  vx[i] = vx0;
  vy[i] = vy0;
  pmax[i] = life;
  plife[i] = life;
}

function spawnOrbit(ang, rad) {
  var i = allocSlot();
  if (i < 0) return;
  pmode[i] = 1;
  pang[i] = ang;
  prad[i] = rad;
  pmax[i] = 20 + (i % 11);
  plife[i] = (i * 5) % pmax[i];
  if (plife[i] < 1) plife[i] = 1;
  px[i] = gemX;
  py[i] = gemY;
}

function beginCharge() {
  var i;
  boltOn = 0;
  for (i = 0; i < MAXP; i++) pmode[i] = 0;
}

function beginCast() {
  var i, a, sp, k;
  for (i = 0; i < MAXP; i++) {
    if (pmode[i] === 1) {
      a = pang[i];
      sp = 0.85 + (i % 5) * 0.24;
      vx[i] = Math.cos(a) * sp;
      vy[i] = Math.sin(a) * sp;
      pmode[i] = 2;
      pmax[i] = 16 + (i % 10);
      plife[i] = pmax[i];
    }
  }
  for (k = 0; k < 12; k++) {
    a = k * 0.523599;
    sp = 0.9 + (k % 4) * 0.38;
    spawnFree(gemX, gemY, Math.cos(a) * sp, Math.sin(a) * sp, 18 + (k % 8));
  }
  boltOn = 1;
  boltX = gemX + 2;
  boltY = gemY;
}

function maintainOrbits() {
  var alive = 0;
  var i, want, spawned, ang;
  for (i = 0; i < MAXP; i++) {
    if (pmode[i] === 1) alive++;
  }
  want = 4 + ((stTimer * 10) / DURS[1] | 0);
  if (want > 14) want = 14;
  spawned = 0;
  while (alive < want && spawned < 2) {
    ang = alive * 2.513 + stTimer * 0.17;
    spawnOrbit(ang, 8 + (alive % 4) * 1.5);
    alive++;
    spawned++;
  }
}

function updateParticles() {
  var i, dir, spn;
  for (i = 0; i < MAXP; i++) {
    if (pmode[i] === 1) {
      if (state !== ST_CHARGE) {
        pmode[i] = 0;
        continue;
      }
      dir = (i & 1) ? 1 : -1;
      pang[i] += dir * (0.09 + (i % 5) * 0.012);
      prad[i] -= 0.06;
      if (prad[i] < 2.2) {
        prad[i] = 9 + (i % 3) * 1.7;
        plife[i] = pmax[i];
      } else {
        plife[i] -= 1;
        if (plife[i] <= 0) plife[i] = pmax[i];
      }
      px[i] = gemX + Math.cos(pang[i]) * prad[i];
      py[i] = gemY + Math.sin(pang[i]) * prad[i];
    } else if (pmode[i] === 2) {
      px[i] += vx[i];
      py[i] += vy[i];
      vx[i] *= 0.985;
      vy[i] *= 0.985;
      plife[i] -= 1;
      if (plife[i] <= 0) pmode[i] = 0;
    }
  }
  if (boltOn) {
    if (!(state === ST_CAST && stTimer === 0)) {
      boltX += 2;
      if ((frameN & 1) === 0) {
        spn = (rnd() % 7) - 3;
        spawnFree(boltX - 2, boltY, -0.4, spn * 0.14, 8 + (rnd() % 6));
      }
      if (boltX > 132) boltOn = 0;
    }
  }
}

function updateShake() {
  var i, x, y;
  if (state === ST_CAST && stTimer < 18) {
    i = stTimer % 10;
    x = SHX[i];
    y = SHY[i];
    if (stTimer >= 8) {
      if (x > 1) x = 1;
      else if (x < -1) x = -1;
      if (y > 1) y = 1;
      else if (y < -1) y = -1;
    }
    shakeX = x;
    shakeY = y;
  } else {
    shakeX = 0;
    shakeY = 0;
  }
}

function capture() {
  pStaff = staffAng;
  pArm = armF;
  pHead = headF;
  pRobe = robeF;
  pBeard = beardF;
}

function applyIdle(t) {
  staffAng = 0.82 + Math.sin(t * 0.048) * 0.11;
  armF = 0;
  headF = 0;
  robeF = Math.sin(t * 0.072) * 1.6;
  beardF = Math.sin(t * 0.09) * 2.1;
  bobPx = ((t / 20) | 0) & 1;
}

function updatePose() {
  var dur = DURS[state];
  var u = dur > 0 ? stTimer / dur : 0;
  var e = easeInOut(u < 1 ? u : 1);
  var u2, e2;
  if (state === ST_IDLE) {
    applyIdle(stTimer);
    return;
  }
  bobPx = 0;
  if (state === ST_CHARGE) {
    staffAng = lerp(pStaff, 1.3, e);
    armF = lerp(pArm, 6, e);
    headF = lerp(pHead, -1.65, e);
    robeF = lerp(pRobe, 0.2, e);
    beardF = lerp(pBeard, 0.35, e);
  } else if (state === ST_CAST) {
    u2 = u < 0.36 ? u / 0.36 : 1;
    e2 = easeOut(u2);
    staffAng = lerp(pStaff, 0.18, e2);
    armF = lerp(pArm, 1, e2);
    headF = lerp(pHead, 1.05, e2);
    robeF = lerp(pRobe, 1.45, e2);
    beardF = lerp(pBeard, 0.9, e2);
  } else {
    staffAng = lerp(pStaff, 0.82, e);
    armF = lerp(pArm, 0, e);
    headF = lerp(pHead, 0, e);
    robeF = lerp(pRobe, 0, e);
    beardF = lerp(pBeard, 0, e);
  }
}

function computeAnchors() {
  var lift = qi(armF);
  var topSway = qi((robeF * 3) / 10);
  var sx, sy;
  anchorX = AX;
  anchorY = AY0 - bobPx;
  sx = anchorX + 18 + topSway;
  sy = anchorY + 21;
  handX = sx + 5;
  handY = sy - lift;
  gemX = qi(handX + Math.cos(staffAng) * STAFF_LEN);
  gemY = qi(handY - Math.sin(staffAng) * STAFF_LEN);
}

function onEnter() {
  if (state === ST_CHARGE) beginCharge();
  else if (state === ST_CAST) beginCast();
}

function update() {
  frameN++;
  stTimer++;
  if (stTimer >= DURS[state]) {
    capture();
    state = (state + 1) & 3;
    stTimer = 0;
    onEnter();
  }
  updatePose();
  computeAnchors();
  if (state === ST_CHARGE) maintainOrbits();
  updateParticles();
  updateShake();
}

function drawParticles() {
  var i, c, x, y;
  for (i = 0; i < MAXP; i++) {
    if (pmode[i] === 0) continue;
    c = 20 + pstep(i);
    x = px[i] | 0;
    y = py[i] | 0;
    plot(x, y, c, 0);
  }
}

function drawFlash() {
  var r, r2, inner, x, y, d, c;
  if (state !== ST_CAST || stTimer > 10) return;
  r = stTimer < 4 ? 8 : stTimer < 8 ? 5 : 3;
  r2 = r * r;
  inner = (r - 2) * (r - 2);
  if (inner < 0) inner = 0;
  for (y = -r; y <= r; y++) {
    for (x = -r; x <= r; x++) {
      d = x * x + y * y;
      if (d <= r2 && d >= inner) {
        c = (d * 2 > r2) ? 21 : 20;
        plot(gemX + x, gemY + y, c, 0);
      }
    }
  }
}

function drawBolt() {
  var x, y;
  if (!boltOn) return;
  x = boltX | 0;
  y = boltY | 0;
  plot(x + 1, y, 20, 0);
  plot(x, y, 20, 0);
  plot(x - 1, y, 21, 0);
  plot(x - 2, y, 22, 0);
  plot(x - 3, y, 22, 0);
  plot(x - 4, y, 23, 0);
  plot(x - 5, y, 23, 0);
  plot(x, y - 1, 21, 0);
  plot(x, y + 1, 21, 0);
  plot(x - 1, y - 1, 22, 0);
  plot(x - 1, y + 1, 22, 0);
}

function drawGem() {
  var wing = 22;
  var rate;
  if (state === ST_CAST) wing = stTimer < 14 ? 20 : 21;
  else if (state === ST_CHARGE) {
    rate = stTimer > 70 ? 2 : stTimer > 34 ? 3 : 5;
    wing = GEMSEQ[((stTimer / rate) | 0) & 7];
  } else if (state === ST_RECOVER && stTimer < 18) wing = 21;
  plot(gemX, gemY, 20, 0);
  plot(gemX + 1, gemY, wing, 0);
  plot(gemX - 1, gemY, wing, 0);
  plot(gemX, gemY - 1, wing, 0);
  plot(gemX, gemY + 1, wing, 0);
  if (state === ST_CHARGE && stTimer > 20) {
    plot(gemX, gemY - 2, 21, 0);
    plot(gemX + 2, gemY, 21, 0);
  }
  if (state === ST_CAST && stTimer < 16) {
    plot(gemX + 2, gemY, 20, 0);
    plot(gemX, gemY - 2, 20, 0);
    plot(gemX - 2, gemY, 20, 0);
    plot(gemX, gemY + 2, 20, 0);
  }
}

function renderLogical() {
  stamp++;
  if (stamp > 255) {
    occ.fill(0);
    stamp = 1;
  }
  drawSky();
  drawMoon();
  drawStars();
  drawFloor();
  drawWizard();
  rimPass();
  drawGroundGlow();
  drawFlash();
  drawParticles();
  drawBolt();
  drawGem();
}

function render() {
  var dw, dh, dx, dy;
  renderLogical();
  octx.putImageData(img, 0, 0);
  dctx.imageSmoothingEnabled = false;
  dctx.fillStyle = bgStyle;
  dctx.fillRect(0, 0, view.width, view.height);
  dw = LW * viewScale;
  dh = LH * viewScale;
  dx = destX + shakeX * viewScale;
  dy = destY + shakeY * viewScale;
  dctx.drawImage(off, dx, dy, dw, dh);
}

function resize() {
  var cssW = window.innerWidth | 0;
  var cssH = window.innerHeight | 0;
  var sc, scY;
  view.width = cssW;
  view.height = cssH;
  view.style.width = cssW + 'px';
  view.style.height = cssH + 'px';
  sc = (cssW / LW) | 0;
  scY = (cssH / LH) | 0;
  if (scY < sc) sc = scY;
  if (sc < 1) sc = 1;
  viewScale = sc;
  destX = ((cssW - LW * viewScale) / 2) | 0;
  destY = ((cssH - LH * viewScale) / 2) | 0;
  dctx.imageSmoothingEnabled = false;
}

function frame(now) {
  var dt, n;
  if (lastT === 0) lastT = now;
  dt = now - lastT;
  lastT = now;
  if (dt > 100) dt = 100;
  acc += dt;
  n = 0;
  while (acc >= STEP && n < 4) {
    update();
    acc -= STEP;
    n++;
  }
  if (acc > STEP) acc = STEP;
  render();
  requestAnimationFrame(frame);
}

function boot() {
  var bytes;
  initPalette();
  view = document.getElementById('view');
  dctx = view.getContext('2d', { alpha: false });
  off = document.createElement('canvas');
  off.width = LW;
  off.height = LH;
  octx = off.getContext('2d', { alpha: false });
  img = octx.createImageData(LW, LH);
  bytes = img.data;
  buf32 = new Uint32Array(bytes.buffer, bytes.byteOffset, LW * LH);
  resize();
  window.addEventListener('resize', resize);
  requestAnimationFrame(frame);
}

boot();
</script>
</body>
</html>
