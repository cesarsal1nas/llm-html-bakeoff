<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grok420hermes</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0a0018;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            image-rendering: pixelated;
        }
        canvas {
            image-rendering: pixelated;
            border: 4px solid #4a2c7a;
            box-shadow: 0 0 0 8px #1a0f2e;
        }
    </style>
</head>
<body>
    <canvas id="display"></canvas>
    <script>
        // grok420hermes - Pixel Art Wizard Spellcaster
        // Single file, vanilla JS, Canvas 2D - 128x96 logical -> integer scaled fullscreen
        
        const LOGICAL_W = 128;
        const LOGICAL_H = 96;
        const WIZARD_W = 32;
        const WIZARD_H = 40;
        
        // Fixed palette - deep night blues/purples, warm robes, magic glows (~24 colors)
        const PALETTE = {
            sky1: '#0a0018',  // deep night
            sky2: '#1a0f2e',
            sky3: '#2a1f42',
            moon: '#f0e0c8',
            star: '#ffffff',
            floor: '#3a2a1f',
            floor2: '#2a1f18',
            hat: '#3a2a6b',
            hat2: '#2a1f4a',
            skin: '#e8c8a0',
            beard: '#e0d0b8',
            beard2: '#c8b090',
            robe: '#6b2a8a',
            robe2: '#4a1f6b',
            robeOutline: '#1f0f3a',
            staffWood: '#5a3a1a',
            staffGem: '#ff44aa',
            gemGlow1: '#ff88ff',
            gemGlow2: '#aa44ff',
            magic1: '#44ffff',
            magic2: '#88aaff',
            magic3: '#ffaa44',
            spark1: '#ffffff',
            spark2: '#aaffff',
            spark3: '#4488ff',
            burst: '#ffee88'
        };
        
        // Offscreen logical canvas
        const offscreen = document.createElement('canvas');
        offscreen.width = LOGICAL_W;
        offscreen.height = LOGICAL_H;
        const ctx = offscreen.getContext('2d', { alpha: true });
        ctx.imageSmoothingEnabled = false;
        
        // Display canvas
        const display = document.getElementById('display');
        const dctx = display.getContext('2d', { alpha: false });
        dctx.imageSmoothingEnabled = false;
        
        let scale = 1;
        let offsetX = 0;
        let offsetY = 0;
        
        function resize() {
            const maxScaleX = Math.floor(window.innerWidth / LOGICAL_W);
            const maxScaleY = Math.floor(window.innerHeight / LOGICAL_H);
            scale = Math.max(1, Math.min(maxScaleX, maxScaleY));
            
            display.width = LOGICAL_W * scale;
            display.height = LOGICAL_H * scale;
            
            offsetX = Math.floor((window.innerWidth - display.width) / 2);
            offsetY = Math.floor((window.innerHeight - display.height) / 2);
            
            display.style.position = 'absolute';
            display.style.left = offsetX + 'px';
            display.style.top = offsetY + 'px';
        }
        
        window.addEventListener('resize', resize);
        resize();
        
        // Animation variables
        let time = 0;
        let state = 'IDLE'; // IDLE, CHARGE, CAST, RECOVER
        let stateTimer = 0;
        let staffAngle = 0;
        let armRaise = 0;
        let headTilt = 0;
        let robeSway = 0;
        let gemPulse = 0;
        let shake = 0;
        
        // Particle pool (allocation-free)
        const MAX_PARTICLES = 48;
        let particles = [];
        for (let i = 0; i < MAX_PARTICLES; i++) {
            particles.push({
                active: false,
                x: 0, y: 0,
                vx: 0, vy: 0,
                life: 0,
                colorIndex: 0
            });
        }
        
        function spawnParticle(x, y, vx, vy, life, colorIdx) {
            for (let p of particles) {
                if (!p.active) {
                    p.active = true;
                    p.x = Math.floor(x);
                    p.y = Math.floor(y);
                    p.vx = vx;
                    p.vy = vy;
                    p.life = life;
                    p.colorIndex = colorIdx;
                    return;
                }
            }
        }
        
        function updateParticles() {
            for (let p of particles) {
                if (!p.active) continue;
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                p.vx *= 0.96;
                p.vy *= 0.96;
                if (p.life <= 0) p.active = false;
            }
        }
        
        function drawParticles() {
            const colors = [PALETTE.spark1, PALETTE.spark2, PALETTE.spark3, PALETTE.magic1];
            for (let p of particles) {
                if (!p.active) continue;
                const alpha = Math.floor((p.life / 30) * 3);
                const col = colors[Math.min(p.colorIndex, colors.length - 1)];
                ctx.fillStyle = col;
                ctx.fillRect(Math.floor(p.x), Math.floor(p.y), 1, 1);
            }
        }
        
        // Draw background
        function drawBackground() {
            // Sky gradient simulation with rects
            ctx.fillStyle = PALETTE.sky1;
            ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
            
            ctx.fillStyle = PALETTE.sky2;
            ctx.fillRect(0, 0, LOGICAL_W, 55);
            
            ctx.fillStyle = PALETTE.sky3;
            ctx.fillRect(0, 0, LOGICAL_W, 38);
            
            // Moon
            ctx.fillStyle = PALETTE.moon;
            ctx.fillRect(88, 18, 11, 11);
            ctx.fillStyle = PALETTE.sky1;
            ctx.fillRect(91, 21, 5, 5);
            
            // Stars (twinkling)
            const twinkle = Math.sin(time * 0.1) * 0.5 + 0.5;
            ctx.fillStyle = PALETTE.star;
            const stars = [
                [12, 12], [45, 8], [67, 22], [23, 31], [101, 15], 
                [78, 35], [15, 48], [110, 42]
            ];
            for (let i = 0; i < stars.length; i++) {
                const s = stars[i];
                const bright = (i % 3 === Math.floor(time * 0.3) % 3) ? 1 : 0.6;
                ctx.globalAlpha = bright * (0.7 + twinkle * 0.3);
                ctx.fillRect(s[0], s[1], 1, 1);
            }
            ctx.globalAlpha = 1.0;
            
            // Stone floor
            ctx.fillStyle = PALETTE.floor;
            ctx.fillRect(0, 68, LOGICAL_W, LOGICAL_H - 68);
            ctx.fillStyle = PALETTE.floor2;
            for (let x = 0; x < LOGICAL_W; x += 8) {
                ctx.fillRect(x, 68, 4, 4);
            }
            
            // Ground line
            ctx.fillStyle = '#1a140f';
            ctx.fillRect(0, 67, LOGICAL_W, 2);
        }
        
        // Draw wizard (procedural pixel art)
        function drawWizard() {
            const baseX = 42;
            const baseY = 32 + Math.floor(Math.sin(time * 0.15) * 1.2); // idle bob
            
            const sway = Math.sin(time * 0.2) * 0.8;
            const currentStaffAngle = staffAngle + sway * 0.3;
            const currentArm = armRaise * 0.7;
            const currentHeadTilt = headTilt * 0.6;
            const currentRobeSway = robeSway * 1.5;
            
            // Shadow
            ctx.fillStyle = 'rgba(10,0,20,0.6)';
            ctx.fillRect(baseX + 4, baseY + 36, 26, 6);
            
            // Robe base
            ctx.fillStyle = PALETTE.robe;
            ctx.fillRect(baseX + 8, baseY + 18, 16, 22); // body
            ctx.fillRect(baseX + 6, baseY + 28, 20, 14); // lower robe
            
            // Robe sway
            ctx.fillStyle = PALETTE.robe2;
            ctx.fillRect(baseX + 7 + Math.floor(currentRobeSway * 0.5), baseY + 30, 6, 12);
            ctx.fillRect(baseX + 19 + Math.floor(currentRobeSway * 0.3), baseY + 30, 7, 12);
            
            // Robe outline
            ctx.fillStyle = PALETTE.robeOutline;
            ctx.fillRect(baseX + 7, baseY + 18, 1, 22);
            ctx.fillRect(baseX + 23, baseY + 18, 1, 22);
            ctx.fillRect(baseX + 8, baseY + 39, 16, 1);
            
            // Hat
            ctx.fillStyle = PALETTE.hat;
            ctx.fillRect(baseX + 6, baseY + 2, 19, 6); // brim
            ctx.fillRect(baseX + 11, baseY - 8, 9, 11); // cone
            ctx.fillStyle = PALETTE.hat2;
            ctx.fillRect(baseX + 13, baseY - 9, 4, 4); // hat bend highlight
            
            // Beard
            ctx.fillStyle = PALETTE.beard;
            ctx.fillRect(baseX + 13, baseY + 11, 9, 11);
            ctx.fillStyle = PALETTE.beard2;
            ctx.fillRect(baseX + 15, baseY + 13, 6, 7);
            
            // Face
            ctx.fillStyle = PALETTE.skin;
            ctx.fillRect(baseX + 15, baseY + 8, 7, 7);
            
            // Eyes
            ctx.fillStyle = '#1a0a00';
            ctx.fillRect(baseX + 17, baseY + 10, 1, 1);
            ctx.fillRect(baseX + 20, baseY + 10, 1, 1);
            
            // Hat band
            ctx.fillStyle = '#ffcc44';
            ctx.fillRect(baseX + 8, baseY + 4, 14, 2);
            
            // Staff
            const staffX = baseX + 24;
            const staffY = baseY + 14;
            const staffEndX = Math.floor(staffX + Math.cos(currentStaffAngle * Math.PI / 180) * 26);
            const staffEndY = Math.floor(staffY + Math.sin(currentStaffAngle * Math.PI / 180) * 26);
            
            // Staff wood
            ctx.fillStyle = PALETTE.staffWood;
            ctx.fillRect(staffX - 1, staffY - 1, 3, 28); // vertical base
            // angled staff
            ctx.fillRect(Math.min(staffX, staffEndX), Math.min(staffY, staffEndY), 
                        Math.abs(staffEndX - staffX) + 2, Math.abs(staffEndY - staffY) + 2);
            
            // Gem
            const gemX = staffEndX;
            const gemY = staffEndY - 3;
            const pulse = Math.sin(gemPulse * 0.3) * 1.5 + 1.5;
            
            ctx.fillStyle = PALETTE.staffGem;
            ctx.fillRect(gemX - 2, gemY - 2, 5, 5);
            ctx.fillStyle = PALETTE.gemGlow1;
            ctx.fillRect(gemX - 1, gemY - 1, 3, 3);
            
            // Rim light from gem
            if (state === 'CHARGE' || state === 'CAST') {
                ctx.fillStyle = PALETTE.gemGlow2;
                ctx.fillRect(baseX + 6, baseY + 12, 2, 8);
            }
            
            // Arms
            ctx.fillStyle = PALETTE.robe;
            // left arm (holding staff)
            ctx.fillRect(baseX + 8, baseY + 18, 5, 8);
            // right arm raised during charge/cast
            const armY = baseY + 19 + Math.floor(currentArm * -4);
            ctx.fillRect(baseX + 20, armY, 6, 5);
            
            // Hand on staff
            ctx.fillStyle = PALETTE.skin;
            ctx.fillRect(staffX - 3, staffY + 6, 3, 3);
        }
        
        function draw() {
            ctx.clearRect(0, 0, LOGICAL_W, LOGICAL_H);
            drawBackground();
            drawWizard();
            drawParticles();
            
            // Magic burst during CAST
            if (state === 'CAST' && stateTimer < 12) {
                const burstAlpha = (12 - stateTimer) / 12;
                ctx.globalAlpha = burstAlpha * 0.9;
                ctx.fillStyle = PALETTE.burst;
                ctx.fillRect(72, 28, 18, 18);
                ctx.globalAlpha = 1.0;
            }
            
            // Blit to display with integer scale
            dctx.clearRect(0, 0, display.width, display.height);
            dctx.drawImage(offscreen, 0, 0, LOGICAL_W, LOGICAL_H, 
                          0, 0, LOGICAL_W * scale, LOGICAL_H * scale);
        }
        
        function update() {
            time += 1;
            stateTimer++;
            gemPulse += 1;
            
            updateParticles();
            
            // State machine
            if (state === 'IDLE') {
                staffAngle = 35 + Math.sin(time * 0.1) * 4;
                armRaise = 0;
                headTilt = Math.sin(time * 0.08) * 2;
                robeSway = Math.sin(time * 0.13) * 1.5;
                
                if (stateTimer > 65) {
                    state = 'CHARGE';
                    stateTimer = 0;
                }
                
                // occasional idle spark
                if (Math.random() < 0.03) {
                    spawnParticle(68, 32, (Math.random()-0.5)*0.6, -1.2, 22, 0);
                }
            } 
            else if (state === 'CHARGE') {
                staffAngle = 35 - (stateTimer * 1.8);
                armRaise = Math.min(stateTimer / 18, 1.0);
                headTilt = -4;
                robeSway = 2.5;
                gemPulse += 3;
                
                // Spiral sparks inward
                if (stateTimer % 4 === 0 && stateTimer < 45) {
                    const a = time * 0.4;
                    const r = 14 - (stateTimer * 0.3);
                    const px = 74 + Math.cos(a) * r;
                    const py = 29 + Math.sin(a) * r * 0.6;
                    spawnParticle(px, py, (72 - px) * 0.13, (26 - py) * 0.13, 26, Math.floor(Math.random()*3));
                }
                
                if (stateTimer > 52) {
                    state = 'CAST';
                    stateTimer = 0;
                    shake = 4;
                    
                    // Big burst particles
                    for (let i = 0; i < 18; i++) {
                        const vx = (Math.random() - 0.3) * 3.5;
                        const vy = (Math.random() - 1.6) * 2.2;
                        spawnParticle(74, 26, vx, vy, 32 + Math.random()*12, 1);
                    }
                }
            } 
            else if (state === 'CAST') {
                staffAngle = -28;
                armRaise = 1.0;
                headTilt = -8;
                robeSway = 4;
                shake = Math.max(0, shake - 0.6);
                
                // Projectile
                if (stateTimer === 6) {
                    spawnParticle(88, 26, 4.5, -0.8, 38, 2);
                }
                
                if (stateTimer > 24) {
                    state = 'RECOVER';
                    stateTimer = 0;
                }
            } 
            else if (state === 'RECOVER') {
                const t = stateTimer / 26;
                staffAngle = -28 + (t * 63);
                armRaise = Math.max(0, 1.0 - t * 2.2);
                headTilt = -8 + (t * 8);
                robeSway = 4 * (1 - t);
                
                if (stateTimer > 26) {
                    state = 'IDLE';
                    stateTimer = 0;
                }
            }
            
            // Screen shake
            if (shake > 0.3) {
                const sx = (Math.random() - 0.5) * shake;
                const sy = (Math.random() - 0.5) * shake * 0.6;
                ctx.save();
                ctx.translate(sx, sy);
            }
        }
        
        let lastTime = 0;
        const FIXED_TIMESTEP = 1000 / 60;
        let accumulator = 0;
        
        function gameLoop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            const delta = timestamp - lastTime;
            lastTime = timestamp;
            
            accumulator += delta;
            
            while (accumulator >= FIXED_TIMESTEP) {
                update();
                accumulator -= FIXED_TIMESTEP;
            }
            
            draw();
            
            // Draw title in corner
            ctx.fillStyle = '#ffcc88';
            ctx.font = '9px monospace';
            ctx.fillText('GROK420HERMES', 6, 10);
            
            requestAnimationFrame(gameLoop);
        }
        
        // Keyboard interaction (press SPACE to force cast)
        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' && state === 'IDLE') {
                state = 'CHARGE';
                stateTimer = 0;
            }
        });
        
        // Click to cast
        display.addEventListener('click', () => {
            if (state === 'IDLE') {
                state = 'CHARGE';
                stateTimer = 0;
            }
        });
        
        // Boot message
        console.log('%c✧ grok420hermes pixel wizard online ✧\nPress SPACE or click to cast!', 'color:#aa88ff; font-family:monospace');
        
        // Start the magic
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
