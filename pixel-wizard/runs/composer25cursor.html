<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>composer25cursor</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0812; }
  canvas#display {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
  }
</style>
</head>
<body>
<canvas id="display"></canvas>
<script>
(function () {
  'use strict';
  const LW = 128, LH = 96;
  const PAL = [
    '#0a0812', '#12101c', '#1a1628', '#242038', '#2e2848', '#383058',
    '#4a4068', '#5c5280', '#6e6498', '#8878b0',
    '#1c2840', '#243050', '#2c3860', '#344870',
    '#c8a878', '#a88858', '#886840', '#604830',
    '#e8d8c0', '#d0b8a0', '#b89878',
    '#f0f0ff', '#a8d0ff', '#68a8ff', '#4080e8', '#2858c0', '#183878',
    '#ff8868', '#ffcc44', '#88ffcc', '#ffffff'
  ];
  const off = document.createElement('canvas');
  off.width = LW; off.height = LH;
  const ctx = off.getContext('2d', { alpha: false });
  const imgData = ctx.createImageData(LW, LH);
  const buf = imgData.data;
  const display = document.getElementById('display');
  const dctx = display.getContext('2d');
  function setPix(x, y, idx) {
    x = x | 0; y = y | 0;
    if (x < 0 || x >= LW || y < 0 || y >= LH) return;
    const o = (y * LW + x) * 4;
    const h = PAL[idx];
    buf[o] = parseInt(h.slice(1, 3), 16);
    buf[o + 1] = parseInt(h.slice(3, 5), 16);
    buf[o + 2] = parseInt(h.slice(5, 7), 16);
    buf[o + 3] = 255;
  }
  function fillRect(x, y, w, h, idx) {
    x = x | 0; y = y | 0; w = w | 0; h = h | 0;
    for (let j = 0; j < h; j++)
      for (let i = 0; i < w; i++) setPix(x + i, y + j, idx);
  }
  function hLine(x, y, len, idx) {
    x = x | 0; y = y | 0; len = len | 0;
    for (let i = 0; i < len; i++) setPix(x + i, y, idx);
  }
  const C = {
    sky0: 0, sky1: 1, sky2: 2, sky3: 3, stone0: 6, stone1: 7, stone2: 8, stone3: 9,
    night1: 11, night2: 12, night3: 13, skin: 14, skinSh: 15, skinDk: 16, outline: 17,
    beard: 18, beardSh: 19, beardDk: 20,
    magic0: 21, magic1: 22, magic2: 23, magic3: 24, magic4: 25, magic5: 26,
    spark0: 27, spark1: 28, white: 30
  };
  const ST_IDLE = 0, ST_CHARGE = 1, ST_CAST = 2, ST_RECOVER = 3;
  const state = { s: ST_IDLE, t: 0, frame: 0, castInit: 0 };
  const pose = { bob: 0, staffAng: 0.35, armRaise: 0, headTilt: 0, robeSway: 0, beardSway: 0, gemBright: 0, rim: 0 };
  const poseTarget = { bob: 0, staffAng: 0.35, armRaise: 0, headTilt: 0, robeSway: 0, beardSway: 0, gemBright: 0, rim: 0 };
  const shake = { x: 0, y: 0, t: 0 };
  const PARTICLE_N = 64;
  const particles = new Array(PARTICLE_N);
  for (let i = 0; i < PARTICLE_N; i++) {
    particles[i] = { active: 0, x: 0, y: 0, vx: 0, vy: 0, life: 0, maxLife: 0, palStart: 21, palEnd: 25, orbit: 0, ang: 0, rad: 0 };
  }
  const projectile = { active: 0, x: 0, y: 0, vx: 0, life: 0 };
  const stars = [
    { x: 12, y: 8, phase: 0 }, { x: 28, y: 14, phase: 1.2 }, { x: 45, y: 6, phase: 2.1 },
    { x: 72, y: 10, phase: 0.7 }, { x: 95, y: 18, phase: 1.8 }, { x: 108, y: 7, phase: 2.5 },
    { x: 58, y: 22, phase: 0.3 }, { x: 22, y: 26, phase: 1.5 }
  ];
  let lastGemX = 0, lastGemY = 0;
  function lerp(a, b, t) { return a + (b - a) * t; }
  function easeInOut(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
  function q(v) { return v >= 0 ? (v + 0.5) | 0 : (v - 0.5) | 0; }
  function resetParticles() { for (let i = 0; i < PARTICLE_N; i++) particles[i].active = 0; }
  function spawnSpark(px, py, mode, slot) {
    const start = (slot * 8) % PARTICLE_N;
    for (let n = 0; n < PARTICLE_N; n++) {
      const i = (start + n) % PARTICLE_N;
      const p = particles[i];
      if (p.active) continue;
      p.active = 1; p.x = px; p.y = py; p.life = 0;
      if (mode === 0) {
        p.maxLife = 24 + ((i * 7) % 16); p.orbit = 1;
        p.ang = (i / PARTICLE_N) * 6.283 + state.t * 0.08; p.rad = 9 + (i % 4);
        p.vx = 0; p.vy = 0; p.palStart = C.magic0; p.palEnd = C.magic4;
      } else {
        p.maxLife = 18 + ((i * 3) % 12); p.orbit = 0;
        const a = (i / 12) * 6.283;
        p.vx = Math.cos(a) * (1.2 + (i % 3) * 0.4);
        p.vy = Math.sin(a) * (1.2 + (i % 3) * 0.4) - 0.5;
        p.palStart = C.white; p.palEnd = C.magic5;
      }
      return;
    }
  }
  function updateParticles(gemX, gemY, dt) {
    for (let i = 0; i < PARTICLE_N; i++) {
      const p = particles[i];
      if (!p.active) continue;
      p.life += dt;
      if (p.life >= p.maxLife) { p.active = 0; continue; }
      if (p.orbit) {
        p.ang += dt * 0.18;
        const shrink = 1 - p.life / p.maxLife;
        p.rad = 1 + shrink * 8;
        p.x = gemX + Math.cos(p.ang) * p.rad;
        p.y = gemY + Math.sin(p.ang) * p.rad * 0.75;
      } else {
        p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 0.04 * dt;
      }
    }
  }
  function drawParticles() {
    for (let i = 0; i < PARTICLE_N; i++) {
      const p = particles[i];
      if (!p.active) continue;
      const t = p.life / p.maxLife;
      let idx = p.palStart;
      if (t < 0.25) idx = C.white;
      else if (t < 0.5) idx = p.palStart;
      else if (t < 0.75) idx = p.palEnd;
      else idx = C.magic5;
      setPix(q(p.x), q(p.y), idx);
    }
  }
  function updateState(dt) {
    state.t += dt;
    state.frame = ((state.t * 0.1) | 0) % 2;
    if (shake.t > 0) {
      shake.t -= dt;
      shake.x = ((shake.t * 17) | 0) % 3 - 1;
      shake.y = ((shake.t * 23) | 0) % 3 - 1;
      if (shake.t <= 0) { shake.x = 0; shake.y = 0; }
    }
    switch (state.s) {
      case ST_IDLE:
        poseTarget.bob = state.frame === 0 ? 0 : 1;
        poseTarget.beardSway = Math.sin(state.t * 0.08) * 1.5;
        poseTarget.staffAng = 0.35; poseTarget.armRaise = 0;
        poseTarget.headTilt = Math.sin(state.t * 0.06) * 0.5;
        poseTarget.robeSway = Math.sin(state.t * 0.07) * 1;
        poseTarget.gemBright = 0.2; poseTarget.rim = 0.15;
        if (state.t > 180) { state.s = ST_CHARGE; state.t = 0; resetParticles(); }
        break;
      case ST_CHARGE: {
        const prog = easeInOut(Math.min(1, state.t / 90));
        poseTarget.staffAng = lerp(0.35, -0.55, prog);
        poseTarget.armRaise = lerp(0, 1, prog);
        poseTarget.headTilt = lerp(0, -0.8, prog);
        poseTarget.bob = 0; poseTarget.beardSway = 0;
        poseTarget.robeSway = Math.sin(state.t * 0.12) * 0.5;
        poseTarget.gemBright = 0.5 + Math.sin(state.t * 0.25) * 0.5;
        poseTarget.rim = lerp(0.15, 0.7, prog);
        if (state.t > 90) { state.s = ST_CAST; state.t = 0; state.castInit = 0; }
        break;
      }
      case ST_CAST:
        poseTarget.staffAng = -0.55; poseTarget.armRaise = 1;
        poseTarget.gemBright = 1; poseTarget.rim = 1;
        if (!state.castInit) {
          state.castInit = 1;
          for (let k = 0; k < 12; k++) spawnSpark(lastGemX, lastGemY, 1, k);
          shake.t = 8;
          projectile.active = 1; projectile.x = 0; projectile.vx = 2.8; projectile.life = 0;
        }
        if (state.t > 36) { state.s = ST_RECOVER; state.t = 0; }
        break;
      case ST_RECOVER: {
        const prog = easeInOut(Math.min(1, state.t / 60));
        poseTarget.staffAng = lerp(-0.55, 0.35, prog);
        poseTarget.armRaise = lerp(1, 0, prog);
        poseTarget.headTilt = lerp(-0.8, 0, prog);
        poseTarget.gemBright = lerp(1, 0.2, prog);
        poseTarget.rim = lerp(1, 0.15, prog);
        poseTarget.beardSway = 0; poseTarget.robeSway = 0;
        if (state.t > 60) { state.s = ST_IDLE; state.t = 0; resetParticles(); }
        break;
      }
    }
    const snap = 0.18;
    pose.bob = lerp(pose.bob, poseTarget.bob, snap);
    pose.staffAng = lerp(pose.staffAng, poseTarget.staffAng, snap);
    pose.armRaise = lerp(pose.armRaise, poseTarget.armRaise, snap);
    pose.headTilt = lerp(pose.headTilt, poseTarget.headTilt, snap);
    pose.robeSway = lerp(pose.robeSway, poseTarget.robeSway, snap);
    pose.beardSway = lerp(pose.beardSway, poseTarget.beardSway, snap);
    pose.gemBright = lerp(pose.gemBright, poseTarget.gemBright, snap);
    pose.rim = lerp(pose.rim, poseTarget.rim, snap);
    if (projectile.active) {
      projectile.life += dt;
      projectile.x += projectile.vx * dt;
      if (projectile.life > 45 || projectile.x > LW + 10) projectile.active = 0;
    }
  }
  function drawBackground() {
    for (let y = 0; y < LH - 14; y++) {
      const idx = y < 20 ? C.sky0 : y < 40 ? C.sky1 : y < 55 ? C.sky2 : C.sky3;
      hLine(0, y, LW, idx);
    }
    for (let y = LH - 14; y < LH; y++) {
      const idx = y === LH - 14 ? C.stone2 : y < LH - 4 ? C.stone1 : C.stone0;
      hLine(0, y, LW, idx);
    }
    hLine(0, LH - 14, LW, C.stone3);
    fillRect(98, 16, 10, 10, C.beard);
    fillRect(100, 17, 6, 8, C.magic0);
    fillRect(102, 18, 3, 5, C.beard);
    for (let i = 0; i < stars.length; i++) {
      const st = stars[i];
      setPix(st.x, st.y, Math.sin(state.t * 0.05 + st.phase) > 0.3 ? C.white : C.stone3);
    }
  }
  function drawStaffLine(sx, sy, ex, ey) {
    for (let s = 0; s <= 44; s++) {
      const t = s / 44;
      setPix(q(lerp(sx, ex, t)), q(lerp(sy, ey, t)), C.outline);
      setPix(q(lerp(sx, ex, t)) + 1, q(lerp(sy, ey, t)), C.skinDk);
    }
  }
  function drawWizard() {
    for (let y = 0; y < LH; y++)
      for (let x = 0; x < LW; x++) {
        const o = (y * LW + x) * 4;
        buf[o] = 10; buf[o + 1] = 8; buf[o + 2] = 18; buf[o + 3] = 255;
      }
    drawBackground();
    const bx = q(pose.robeSway);
    const by = q(-q(pose.bob));
    const tilt = q(pose.headTilt);
    const staffA = pose.staffAng;
    const arm = pose.armRaise;
    const ox = bx + 52;
    const oy = by + 28;
    fillRect(ox - 1, oy + 18, 14, 8, C.outline);
    fillRect(ox, oy + 19, 12, 6, C.skinSh);
    fillRect(ox + 1, oy + 20, 10, 4, C.skin);
    const bs = q(pose.beardSway);
    fillRect(ox + bs, oy + 22, 10, 6, C.outline);
    fillRect(ox + 1 + bs, oy + 23, 8, 4, C.beard);
    fillRect(ox + 2 + bs, oy + 25, 6, 3, C.beardSh);
    fillRect(ox + 3 + bs, oy + 27, 4, 2, C.beardDk);
    fillRect(ox + tilt, oy + 14, 10, 8, C.outline);
    fillRect(ox + 1 + tilt, oy + 15, 8, 6, C.skin);
    setPix(ox + 3 + tilt, oy + 17, C.outline);
    setPix(ox + 6 + tilt, oy + 17, C.outline);
    fillRect(ox + 2 + tilt, oy + 6, 8, 10, C.outline);
    fillRect(ox + 3 + tilt, oy + 7, 6, 8, C.skinSh);
    fillRect(ox + 3 + tilt, oy + 5, 7, 3, C.outline);
    fillRect(ox + 4 + tilt, oy + 4, 5, 2, C.skinSh);
    fillRect(ox + 5 + tilt, oy + 2, 4, 3, C.outline);
    fillRect(ox + 6 + tilt, oy + 1, 3, 2, C.skinSh);
    fillRect(ox + 8 + tilt, oy - 1, 2, 2, C.outline);
    fillRect(ox + 9 + tilt, oy - 2, 2, 1, C.night2);
    fillRect(ox + 7 + tilt, oy, 2, 2, C.outline);
    const robeOff = q(pose.robeSway);
    fillRect(ox - 2 + robeOff, oy + 24, 16, 10, C.outline);
    fillRect(ox - 1 + robeOff, oy + 25, 14, 8, C.night2);
    fillRect(ox + robeOff, oy + 26, 12, 6, C.night1);
    fillRect(ox + 1 + robeOff, oy + 27, 4, 4, C.night3);
    fillRect(ox + 7 + robeOff, oy + 27, 4, 4, C.night3);
    const handX = ox + 10 + q(arm * 2);
    const handY = oy + 20 - q(arm * 4);
    fillRect(handX, handY, 3, 3, C.skin);
    const staffLen = 22;
    const sx = handX + 1;
    const sy = handY;
    const ex = q(sx + Math.cos(staffA) * staffLen);
    const ey = q(sy + Math.sin(staffA) * staffLen);
    drawStaffLine(sx, sy, ex, ey);
    const gemIdx = pose.gemBright > 0.6 ? C.spark1 : pose.gemBright > 0.3 ? C.magic2 : C.magic3;
    fillRect(ex - 1, ey - 1, 3, 3, C.outline);
    setPix(ex, ey, gemIdx);
    setPix(ex - 1, ey, C.magic1);
    setPix(ex + 1, ey, C.magic4);
    if (pose.rim > 0.2) {
      const rim = pose.rim > 0.5 ? C.magic0 : C.night3;
      setPix(ox + 8 + tilt, oy + 16, rim);
      setPix(ox + 9 + tilt, oy + 18, rim);
      setPix(ox + 11, oy + 26, rim);
    }
    lastGemX = ex; lastGemY = ey;
    return { gemX: ex, gemY: ey };
  }
  function drawProjectile() {
    if (!projectile.active) return;
    const px = q(52 + projectile.x);
    const py = q(38 + Math.sin(projectile.life * 0.2) * 2);
    fillRect(px, py, 4, 3, C.spark0);
    fillRect(px + 1, py, 2, 3, C.white);
    setPix(px + 5, py + 1, C.magic1);
    setPix(px - 1, py + 1, C.magic2);
  }
  function drawBurst() {
    if (state.s !== ST_CAST || state.t > 12) return;
    const cx = q(52 + state.t * 1.5);
    const cy = 38;
    const r = q(state.t * 2);
    for (let a = 0; a < 8; a++) {
      const ang = (a / 8) * 6.283;
      setPix(q(cx + Math.cos(ang) * r), q(cy + Math.sin(ang) * r), C.white);
      setPix(q(cx + Math.cos(ang) * (r + 1)), q(cy + Math.sin(ang) * (r + 1)), C.magic1);
    }
  }
  let last = 0, acc = 0;
  const STEP = 1000 / 60;
  let spawnChargeTick = -1;
  function resizeDisplay() {
    const sw = window.innerWidth, sh = window.innerHeight;
    const scale = Math.max(1, Math.floor(Math.min(sw / LW, sh / LH)));
    display.width = LW * scale;
    display.height = LH * scale;
    display.style.width = display.width + 'px';
    display.style.height = display.height + 'px';
  }
  function frame(now) {
    if (!last) last = now;
    let delta = now - last;
    last = now;
    if (delta > 100) delta = 100;
    acc += delta;
    while (acc >= STEP) {
      updateState(1);
      acc -= STEP;
    }
    const gem = drawWizard();
    updateParticles(gem.gemX, gem.gemY, 1);
    if (state.s === ST_CHARGE) {
      const tick = state.t | 0;
      if (tick !== spawnChargeTick && tick % 8 === 0) {
        spawnChargeTick = tick;
        spawnSpark(gem.gemX, gem.gemY, 0, tick);
      }
    }
    drawParticles();
    drawBurst();
    drawProjectile();
    ctx.putImageData(imgData, shake.x, shake.y);
    resizeDisplay();
    dctx.imageSmoothingEnabled = false;
    dctx.drawImage(off, 0, 0, display.width, display.height);
    requestAnimationFrame(frame);
  }
  window.addEventListener('resize', resizeDisplay);
  resizeDisplay();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
